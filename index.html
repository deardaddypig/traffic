<script>
  // 禁用滑鼠右鍵
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // 禁用快捷鍵 (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S)
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.key === 'S' || e.key === 's'))
    ) {
      e.preventDefault();
      return false;
    }
  });
</script>

    <script>
        // Web Audio API Sound Effects Engine
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playStep() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.07);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.07);
            }

            playHonk() {
                if (!this.ctx) return;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc1.type = 'sawtooth';
                osc2.type = 'square';
                osc1.frequency.setValueAtTime(360, this.ctx.currentTime);
                osc2.frequency.setValueAtTime(450, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(this.ctx.destination);
                osc1.start();
                osc2.start();
                osc1.stop(this.ctx.currentTime + 0.2);
                osc2.stop(this.ctx.currentTime + 0.2);
            }

            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playScoldSound() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.setValueAtTime(300, this.ctx.currentTime + 0.1);
                osc.frequency.setValueAtTime(100, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playWinMelody() {
                if (!this.ctx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.09);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.09);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.09 + 0.14);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.09);
                    osc.stop(this.ctx.currentTime + i * 0.09 + 0.14);
                });
            }

            playSchoolBell() {
                if (!this.ctx) return;
                for (let i = 0; i < 4; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, this.ctx.currentTime + i * 0.18);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + i * 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.18 + 0.16);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.18);
                    osc.stop(this.ctx.currentTime + i * 0.18 + 0.16);
                }
            }
        }

        const sound = new SoundFX();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 40;
        const COLS = 10;
        const ROWS = 12.5;

        let score = 0;
        let lives = 3;
        let level = 1;
        let gameState = 'CHAR_SELECT';
        let selectedCharacter = 'GIRL';
        let currentWeather = 'SUNNY'; // SUNNY, RAINY, SUNSET
        let animFrameId = null;

        let rainParticles = [];
        let cloudParticles = [];
        let confetti = [];

        // Player State
        const player = {
            gridX: 4,
            gridY: 11,
            x: 4 * GRID_SIZE,
            y: 11 * GRID_SIZE,
            size: GRID_SIZE,
            dir: 'UP', // UP, DOWN, LEFT, RIGHT
            isMoving: false
        };

        let vehicles = [];
        const laneConfigs = [
            { y: 2, type: 'TAXI', speed: 1.74, dir: 1 },
            { y: 3, type: 'MINIBUS', speed: -2.13, dir: -1 },
            { y: 4, type: 'BUS', speed: 1.16, dir: 1 },
            { y: 6, type: 'CAR_RED', speed: -2.42, dir: -1 },
            { y: 7, type: 'TAXI', speed: 1.94, dir: 1 },
            { y: 8, type: 'MINIBUS', speed: -1.84, dir: -1 },
            { y: 9, type: 'CAR_BLUE', speed: 2.32, dir: 1 }
        ];

        function initWeather() {
            const types = ['SUNNY', 'RAINY', 'SUNSET'];
            currentWeather = types[(level - 1) % types.length];

            // Setup Rain Particles
            rainParticles = [];
            if (currentWeather === 'RAINY') {
                for (let i = 0; i < 70; i++) {
                    rainParticles.push({
                        x: Math.random() * 400,
                        y: Math.random() * 500,
                        len: Math.random() * 12 + 6,
                        speed: Math.random() * 6 + 10
                    });
                }
            }

            // Setup Clouds
            cloudParticles = [
                { x: 20, y: 12, speed: 0.15, size: 28 },
                { x: 180, y: 8, speed: 0.22, size: 36 },
                { x: 310, y: 15, speed: 0.18, size: 24 }
            ];

            updateHUD();
        }

        function updateWeatherAndClouds() {
            // Update Clouds
            cloudParticles.forEach(c => {
                c.x += c.speed;
                if (c.x > 420) c.x = -60;
            });

            // Update Rain
            if (currentWeather === 'RAINY') {
                rainParticles.forEach(p => {
                    p.y += p.speed;
                    p.x -= 1.2; // Slight wind slant
                    if (p.y > 500) {
                        p.y = -10;
                        p.x = Math.random() * 420;
                    }
                });
            }
        }

        function drawClouds() {
            ctx.fillStyle = currentWeather === 'SUNSET' ? 'rgba(255, 204, 128, 0.5)' : 'rgba(255, 255, 255, 0.6)';
            cloudParticles.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + 15, c.y - 6, c.size * 0.8, 0, Math.PI * 2);
                ctx.arc(c.x + 30, c.y, c.size * 0.7, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawRainAndOverlay() {
            if (currentWeather === 'RAINY') {
                // Rain Streaks
                ctx.strokeStyle = 'rgba(179, 229, 252, 0.65)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                rainParticles.forEach(p => {
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 3, p.y + p.len);
                });
                ctx.stroke();

                // Blue Rain Overlay Filter
                ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
                ctx.fillRect(0, 0, 400, 500);
            } else if (currentWeather === 'SUNSET') {
                // Sunset Warm Glow Filter
                ctx.fillStyle = 'rgba(255, 112, 67, 0.15)';
                ctx.fillRect(0, 0, 400, 500);
            }
        }

        function drawSchoolBuilding() {
            // Main school building wall (Holy Family Canossian Pink & Off-white)
            ctx.fillStyle = '#F06292'; // Signature Pink
            ctx.fillRect(0, 0, 400, 70);

            // Off-white / Cream upper trim
            ctx.fillStyle = '#FFF8E1';
            ctx.fillRect(0, 0, 400, 22);

            // School Name Text: "Holy Family Canossian School"
            ctx.fillStyle = '#880E4F';
            ctx.font = 'bold 8px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Holy Family Canossian School', 200, 15);

            // Windows & AC units
            ctx.fillStyle = '#81D4FA';
            for (let i = 12; i < 400; i += 38) {
                // Windows with shine
                ctx.fillRect(i, 28, 22, 14);
                ctx.fillRect(i, 48, 22, 14);
                
                ctx.fillStyle = '#0288D1';
                ctx.fillRect(i + 10, 28, 2, 14);
                ctx.fillRect(i, 35, 22, 2);

                // Small air conditioners (Pixel detail)
                ctx.fillStyle = '#E0E0E0';
                ctx.fillRect(i + 24, 42, 8, 6);
                ctx.fillStyle = '#757575';
                ctx.fillRect(i + 29, 43, 2, 4);

                ctx.fillStyle = '#81D4FA';
            }

            // Main Entrance Gate Area (Middle Gate: COLS 4 & 5 -> X: 160 to 240)
            ctx.fillStyle = '#37474F';
            ctx.fillRect(150, 36, 100, 44); // Frame

            // Open Gate Passage
            ctx.fillStyle = '#CFD8DC';
            ctx.fillRect(160, 40, 80, 40);

            // Gate Iron Pillars
            ctx.fillStyle = '#1A237E';
            ctx.fillRect(156, 36, 6, 44);
            ctx.fillRect(238, 36, 6, 44);

            // Main Entrance Tag / Arrow Sign (正門入口)
            ctx.fillStyle = '#4CAF50'; // Green Sign
            ctx.fillRect(165, 38, 70, 14);
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 1;
            ctx.strokeRect(165, 38, 70, 14);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 8px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('正門入口 ⬇️', 200, 48);

            // Side Fences (Non-entrance areas)
            ctx.fillStyle = '#78909C';
            ctx.fillRect(0, 68, 150, 4);
            ctx.fillRect(250, 68, 150, 4);

            // Junction Road Signboard (聯合道)
            drawRoadSign(10, 42);
        }

        function drawRoadSign(x, y) {
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x, y, 58, 24);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, 58, 24);
            
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 8px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('聯合道', x + 29, y + 9);
            ctx.fillText('Junction Rd', x + 29, y + 19);
        }

        function drawEnvironment() {
            // Sidewalk Top
            ctx.fillStyle = '#CFD8DC';
            ctx.fillRect(0, 70, 400, 10);

            // Safe Island / Refuge Zone (Middle Row 5)
            ctx.fillStyle = '#78909C';
            ctx.fillRect(0, 5 * GRID_SIZE, 400, GRID_SIZE);
            
            // Tactile yellow paving
            ctx.fillStyle = '#FBC02D';
            ctx.fillRect(0, 5 * GRID_SIZE + 14, 400, 12);
            ctx.fillStyle = '#F57F17';
            for (let tx = 0; tx < 400; tx += 8) {
                ctx.fillRect(tx, 5 * GRID_SIZE + 14, 2, 12);
            }

            // Green Trees on Safe Island Side
            drawPixelTree(30, 5 * GRID_SIZE + 4);
            drawPixelTree(360, 5 * GRID_SIZE + 4);

            // Bottom Sidewalk (Start Zone)
            ctx.fillStyle = '#CFD8DC';
            ctx.fillRect(0, 10.5 * GRID_SIZE, 400, 2 * GRID_SIZE);

            // Sidewalk Railings (Pedestrian safety barriers)
            ctx.fillStyle = '#FFC107'; // Yellow safety rail
            ctx.fillRect(0, 10.5 * GRID_SIZE, 400, 4);
            for (let rx = 10; rx < 400; rx += 30) {
                if (rx < 140 || rx > 260) {
                    ctx.fillRect(rx, 10.5 * GRID_SIZE, 4, 12);
                }
            }

            // Road Asphalt
            ctx.fillStyle = '#263238';
            ctx.fillRect(0, 2 * GRID_SIZE, 400, 3 * GRID_SIZE); // Upper road
            ctx.fillRect(0, 6 * GRID_SIZE, 400, 4 * GRID_SIZE); // Lower road

            // Zebra Crossing Lines (Directly leading to Main Gate)
            ctx.fillStyle = '#FFEB3B';
            for (let x = 160; x < 240; x += 16) {
                ctx.fillRect(x, 2 * GRID_SIZE, 8, 3 * GRID_SIZE);
                ctx.fillRect(x, 6 * GRID_SIZE, 8, 4 * GRID_SIZE);
            }

            // White Lane Dividers
            ctx.fillStyle = '#FFFFFF';
            [3, 4, 7, 8, 9].forEach(laneY => {
                for (let x = 0; x < 400; x += 28) {
                    ctx.fillRect(x, laneY * GRID_SIZE - 1, 14, 2);
                }
            });
        }

        function drawPixelTree(x, y) {
            // Swaying Leaves Animation
            const sway = Math.sin(Date.now() / 300) * 2;
            ctx.fillStyle = '#5D4037';
            ctx.fillRect(x + 6, y + 16, 8, 14); // Trunk
            
            ctx.fillStyle = '#2E7D32'; // Leaves
            ctx.beginPath();
            ctx.arc(x + 10 + sway, y + 10, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#388E3C';
            ctx.beginPath();
            ctx.arc(x + 7 + sway, y + 7, 10, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawVehicle(v) {
            const x = v.x;
            const y = v.y * GRID_SIZE + 4;
            const w = v.width;
            const h = 32;
            const isLeft = v.speed < 0;

            if (v.type === 'TAXI') {
                // HK Red Taxi 🚕
                ctx.fillStyle = '#C62828';
                ctx.fillRect(x + 2, y + 4, w - 4, h - 8);
                ctx.fillStyle = '#ECEFF1'; // Silver Roof
                ctx.fillRect(x + 10, y + 4, w - 20, h - 12);
                ctx.fillStyle = '#212121'; // Glass
                ctx.fillRect(x + 14, y + 8, w - 28, h - 18);

                // TAXI Sign
                ctx.fillStyle = '#FFEB3B';
                ctx.fillRect(x + w / 2 - 6, y + 1, 12, 4);

                // Flashing Lights
                const headColor = (Math.floor(Date.now() / 200) % 2 === 0) ? '#FFF59D' : '#FFEE58';
                if (isLeft) {
                    ctx.fillStyle = headColor; ctx.fillRect(x, y + 6, 3, 5); ctx.fillRect(x, y + h - 11, 3, 5);
                    ctx.fillStyle = '#FF1744'; ctx.fillRect(x + w - 3, y + 6, 3, 5); ctx.fillRect(x + w - 3, y + h - 11, 3, 5);
                } else {
                    ctx.fillStyle = '#FF1744'; ctx.fillRect(x, y + 6, 3, 5); ctx.fillRect(x, y + h - 11, 3, 5);
                    ctx.fillStyle = headColor; ctx.fillRect(x + w - 3, y + 6, 3, 5); ctx.fillRect(x + w - 3, y + h - 11, 3, 5);
                }

                drawWheel(x + 8, y + 1); drawWheel(x + w - 16, y + 1);
                drawWheel(x + 8, y + h - 4); drawWheel(x + w - 16, y + h - 4);
            } 
            else if (v.type === 'MINIBUS') {
                // HK Green Minibus 🚐
                ctx.fillStyle = '#FFFDE7';
                ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
                ctx.fillStyle = '#2E7D32'; // Green Roof
                ctx.fillRect(x + 2, y + 2, w - 4, 8);

                // Destination Sign
                ctx.fillStyle = '#D32F2F';
                const signX = isLeft ? x + 4 : x + w - 16;
                ctx.fillRect(signX, y + 4, 12, 4);

                ctx.fillStyle = '#37474F';
                ctx.fillRect(x + 8, y + 12, w - 16, 10);

                drawWheel(x + 10, y); drawWheel(x + w - 18, y);
                drawWheel(x + 10, y + h - 3); drawWheel(x + w - 18, y + h - 3);
            } 
            else if (v.type === 'BUS') {
                // KMB Red/Gold Double Decker Bus 🚌
                ctx.fillStyle = '#C62828';
                ctx.fillRect(x + 2, y + 1, w - 4, h - 2);
                ctx.fillStyle = '#FFB300'; // Gold accent
                ctx.fillRect(x + 2, y + 15, w - 4, 3);

                ctx.fillStyle = '#212121';
                ctx.fillRect(x + 6, y + 4, w - 12, 8);
                ctx.fillRect(x + 6, y + 19, w - 12, 8);

                drawWheel(x + 10, y - 1); drawWheel(x + w - 16, y - 1);
                drawWheel(x + 10, y + h - 2); drawWheel(x + w - 16, y + h - 2);
            } 
            else {
                // Private Car
                const mainColor = v.type === 'CAR_RED' ? '#E53935' : '#1976D2';
                ctx.fillStyle = mainColor;
                ctx.fillRect(x + 2, y + 4, w - 4, h - 8);
                ctx.fillStyle = '#37474F';
                ctx.fillRect(x + 10, y + 8, w - 20, h - 16);

                drawWheel(x + 8, y + 1); drawWheel(x + w - 16, y + 1);
                drawWheel(x + 8, y + h - 4); drawWheel(x + w - 16, y + h - 4);
            }
        }

        function drawWheel(wx, wy) {
            ctx.fillStyle = '#111111';
            ctx.fillRect(wx, wy, 8, 3);
            ctx.fillStyle = '#B0BEC5';
            ctx.fillRect(wx + 3, wy + 1, 2, 1);
        }

        function drawPlayer() {
            const x = player.x + 8;
            const y = player.y + 4;
            const stepAnim = Math.floor(Date.now() / 150) % 2 === 0 && player.isMoving;

            // Character Color Configurations
            let hairColor = '#212121';
            let shirtColor = '#E0F7FA'; // Default Girl Blue Dress
            let tieColor = '#0288D1';
            let pantsColor = '#0288D1';

            if (selectedCharacter === 'BOY') {
                shirtColor = '#FFFFFF';
                pantsColor = '#1565C0';
                tieColor = '#D32F2F';
            } else if (selectedCharacter === 'PE') {
                shirtColor = '#FFEB3B'; // Yellow PE Shirt
                pantsColor = '#D32F2F'; // Red Shorts
                tieColor = '#FFEB3B';
            }

            // Head & Hair
            ctx.fillStyle = '#FFCC80';
            ctx.fillRect(x + 6, y + 2, 12, 10);
            
            ctx.fillStyle = hairColor;
            if (selectedCharacter === 'GIRL') {
                ctx.fillRect(x + 4, y, 16, 6); // Girl Hair & Ponytail
                ctx.fillRect(x + 2, y + 4, 3, 6);
            } else {
                ctx.fillRect(x + 5, y, 14, 5); // Boy Short Hair
            }

            // Uniform Body
            ctx.fillStyle = shirtColor;
            ctx.fillRect(x + 5, y + 12, 14, 10);
            
            // Collar/Tie Accent
            ctx.fillStyle = tieColor;
            ctx.fillRect(x + 10, y + 12, 4, 6);

            // Red Backpack 🎒
            ctx.fillStyle = '#D32F2F';
            ctx.fillRect(x + 3, y + 13, 3, 8);
            ctx.fillRect(x + 18, y + 13, 3, 8);

            // Legs & Shoes Animation
            ctx.fillStyle = pantsColor;
            if (stepAnim) {
                ctx.fillRect(x + 5, y + 22, 5, 8);
                ctx.fillRect(x + 14, y + 20, 5, 8);
            } else {
                ctx.fillRect(x + 5, y + 22, 5, 8);
                ctx.fillRect(x + 14, y + 22, 5, 8);
            }

            // Umbrella rendering during Rainy Weather ☂️
            if (currentWeather === 'RAINY') {
                const umbColor = selectedCharacter === 'GIRL' ? '#F48FB1' : '#4FC3F7';
                ctx.fillStyle = umbColor;
                ctx.beginPath();
                ctx.arc(x + 12, y + 2, 18, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = '#37474F';
                ctx.fillRect(x + 11, y + 2, 2, 16);
            }
        }

        function initVehicles() {
            vehicles = [];
            laneConfigs.forEach(config => {
                const count = Math.floor(Math.random() * 2) + 2;
                const baseWidth = config.type === 'BUS' ? 76 : (config.type === 'MINIBUS' ? 58 : 46);
                
                // Speed calculation: Levels 1-4 are slowed down by 30% (0.7x base)
                let speedMultiplier;
                if (level <= 4) {
                    speedMultiplier = 0.70 * (1 + (level - 1) * 0.15);
                } else {
                    speedMultiplier = 1.0 + (level - 4) * 0.22;
                }

                for (let i = 0; i < count; i++) {
                    vehicles.push({
                        x: i * (400 / count) + Math.random() * 40,
                        y: config.y,
                        width: baseWidth,
                        speed: config.speed * speedMultiplier,
                        type: config.type
                    });
                }
            });
        }

        function updateVehicles() {
            vehicles.forEach(v => {
                v.x += v.speed;
                if (v.speed > 0 && v.x > 400) {
                    v.x = -v.width - Math.random() * 50;
                    if (Math.random() < 0.08) sound.playHonk();
                } else if (v.speed < 0 && v.x < -v.width) {
                    v.x = 400 + Math.random() * 50;
                }
            });
        }

        function checkCollisions() {
            const pRect = {
                x: player.x + 8,
                y: player.y + 8,
                w: GRID_SIZE - 16,
                h: GRID_SIZE - 16
            };

            for (let v of vehicles) {
                const vRect = {
                    x: v.x,
                    y: v.y * GRID_SIZE + 4,
                    w: v.width,
                    h: 32
                };

                if (pRect.x < vRect.x + vRect.w &&
                    pRect.x + pRect.w > vRect.x &&
                    pRect.y < vRect.y + vRect.h &&
                    pRect.y + pRect.h > vRect.y) {
                    handleHit();
                    break;
                }
            }
        }

        function handleHit() {
            sound.playHit();
            lives--;
            updateHUD();

            if (lives <= 0) {
                triggerGameOver();
            } else {
                resetPlayerPosition();
            }
        }

        function resetPlayerPosition() {
            player.gridX = 4;
            player.gridY = 11;
            player.x = player.gridX * GRID_SIZE;
            player.y = player.gridY * GRID_SIZE;
        }

        function checkVictory() {
            if (player.gridY <= 1) {
                // Check Entrance Gate: Main Gate is COLS 4 & 5 (X between 160 and 240)
                if (player.gridX === 4 || player.gridX === 5) {
                    // Perfect Entry via Main Gate
                    sound.playSchoolBell();
                    sound.playWinMelody();
                    score += 150 * level;
                    level++;
                    updateHUD();
                    createConfetti();
                    triggerWin();
                } else {
                    // Entered via Fence / Wall -> Trigger Principal Scolding
                    sound.playScoldSound();
                    score = Math.max(0, score - 100);
                    updateHUD();
                    triggerPrincipalScold();
                }
            }
        }

        function createConfetti() {
            confetti = [];
            const colors = ['#FF4081', '#EEFF41', '#00E676', '#00E5FF', '#D500F9'];
            for (let i = 0; i < 60; i++) {
                confetti.push({
                    x: 200,
                    y: 80,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.8) * 8,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 6 + 4
                });
            }
        }

        function updateConfetti() {
            confetti.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
            });
        }

        function drawConfetti() {
            confetti.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
        }

        function movePlayer(dx, dy) {
            if (gameState !== 'PLAYING') return;

            sound.init();
            sound.playStep();

            const newX = player.gridX + dx;
            const newY = player.gridY + dy;

            if (newX >= 0 && newX < COLS && newY >= 1 && newY <= 11) {
                player.gridX = newX;
                player.gridY = newY;
                player.x = newX * GRID_SIZE;
                player.y = newY * GRID_SIZE;
                player.isMoving = true;
                setTimeout(() => player.isMoving = false, 100);

                checkVictory();
            }
        }

        function handleTouch(dir) {
            if (dir === 'UP') movePlayer(0, -1);
            if (dir === 'DOWN') movePlayer(0, 1);
            if (dir === 'LEFT') movePlayer(-1, 0);
            if (dir === 'RIGHT') movePlayer(1, 0);
        }

        window.addEventListener('keydown', e => {
            if (['ArrowUp', 'KeyW'].includes(e.code)) movePlayer(0, -1);
            if (['ArrowDown', 'KeyS'].includes(e.code)) movePlayer(0, 1);
            if (['ArrowLeft', 'KeyA'].includes(e.code)) movePlayer(-1, 0);
            if (['ArrowRight', 'KeyD'].includes(e.code)) movePlayer(1, 0);
        });

        function selectCharacter(type) {
            selectedCharacter = type;
            document.querySelectorAll('.char-card').forEach(el => el.classList.remove('selected'));
            document.getElementById(`char-${type}`).classList.add('selected');
        }

        function updateHUD() {
            document.getElementById('score-val').innerText = score;
            const weatherIcon = currentWeather === 'SUNNY' ? '☀️' : (currentWeather === 'RAINY' ? '🌧️' : '🌅');
            document.getElementById('weather-val').innerText = `${weatherIcon} L${level}`;
            document.getElementById('lives-val').innerText = '❤️'.repeat(Math.max(0, lives));
        }

        function startGame() {
            sound.init();
            if (gameState === 'GAMEOVER') {
                score = 0;
                level = 1;
            }
            lives = 3;
            initWeather();
            updateHUD();
            resetPlayerPosition();
            initVehicles();

            gameState = 'PLAYING';
            hideAllOverlays();
            
            if (!animFrameId) {
                gameLoop();
            }
        }

        function hideAllOverlays() {
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('principal-screen').classList.add('hidden');
            document.getElementById('generic-screen').classList.add('hidden');
            document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none');
        }

        function triggerPrincipalScold() {
            gameState = 'SCOLD';
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('generic-screen').classList.add('hidden');
            document.getElementById('principal-screen').classList.remove('hidden');
            document.getElementById('principal-screen').classList.add('flex');
            document.getElementById('overlay').classList.remove('opacity-0', 'pointer-events-none');
        }

        function nextLevelAfterScold() {
            level++;
            startGame();
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('principal-screen').classList.add('hidden');
            
            document.getElementById('overlay-icon').innerText = '🚗';
            document.getElementById('overlay-title').innerText = '小心車輛！';
            document.getElementById('overlay-desc').innerText = `過馬路要留心！最終得分: ${score}`;
            document.getElementById('overlay-btn').innerText = '再試一次 🔄';
            document.getElementById('overlay-btn').onclick = startGame;
            
            document.getElementById('generic-screen').classList.remove('hidden');
            document.getElementById('generic-screen').classList.add('flex');
            document.getElementById('overlay').classList.remove('opacity-0', 'pointer-events-none');
        }

        function triggerWin() {
            gameState = 'WIN';
            document.getElementById('char-select-screen').classList.add('hidden');
            document.getElementById('principal-screen').classList.add('hidden');
            
            document.getElementById('overlay-icon').innerText = '🏫';
            document.getElementById('overlay-title').innerText = '完美到達學校！🎉';
            document.getElementById('overlay-desc').innerText = `好棒！行正門大閘順利通關！準備進入第 ${level} 關！`;
            document.getElementById('overlay-btn').innerText = '下一關 ➡️';
            document.getElementById('overlay-btn').onclick = startGame;

            document.getElementById('generic-screen').classList.remove('hidden');
            document.getElementById('generic-screen').classList.add('flex');
            document.getElementById('overlay').classList.remove('opacity-0', 'pointer-events-none');
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            updateWeatherAndClouds();

            // Render World
            drawEnvironment();
            drawSchoolBuilding();
            drawClouds();

            if (gameState === 'PLAYING' || gameState === 'WIN') {
                updateVehicles();
                checkCollisions();
            }

            // Render Entities & Weather Effects
            vehicles.forEach(drawVehicle);
            drawPlayer();
            drawRainAndOverlay();

            if (confetti.length > 0) {
                updateConfetti();
                drawConfetti();
            }

            animFrameId = requestAnimationFrame(gameLoop);
        }

        // Initial Frame Render Setup
        initWeather();
        drawEnvironment();
        drawSchoolBuilding();
        drawPlayer();
    </script>
</body>
</html>
